[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-dump"
version = "0.1.0"
description = "Tooling for a private markdown vault: inbox triage by an agent, synced over git"
requires-python = ">=3.12"
dependencies = ["jsonschema", "regress"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[tool.setuptools]
# host/ holds standalone scripts run with the host's system Python, not a package.
packages = ["kd"]

[tool.setuptools.package-data]
kd = ["triage-prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests against a real git daemon; CI runs them, the pre-commit hook skips them"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["kd", "host"]

[[tool.mypy.overrides]]
module = ["inbox", "jsonschema.*", "regress"]
ignore_missing_imports = true
